<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心灵鸡汤 & 壁纸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Serif SC', serif; 
        }
        
        /* 卡片进出动画 */
        .card-enter {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }
        .card-enter-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card-exit {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .card-exit-active {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: opacity 0.4s ease-in, transform 0.4s ease-in;
        }
        
        /* Loading 动画 */
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden relative selection:bg-white/30">

    <!-- 背景层：使用双层Div实现完美的图片交叉淡入淡出 -->
    <div id="bg-container" class="absolute inset-0 z-0 bg-black">
        <!-- 当前显示的图片 -->
        <div id="bg-current" class="absolute inset-0 bg-cover bg-center transition-opacity duration-1000 ease-in-out z-0"></div>
        <!-- 下一张预加载的图片 (淡入) -->
        <div id="bg-next" class="absolute inset-0 bg-cover bg-center transition-opacity duration-1000 ease-in-out opacity-0 z-10"></div>
        <!-- 遮罩层 -->
        <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] z-20 transition-colors duration-500"></div>
    </div>

    <!-- 内容层 -->
    <div class="relative z-30 h-full flex flex-col items-center justify-center p-6">
        
        <!-- 鸡汤卡片 -->
        <div id="quote-card" class="card-enter max-w-4xl w-full bg-white/10 backdrop-blur-md border border-white/20 shadow-2xl rounded-2xl p-8 md:p-16 text-center transform transition-all">
            
            <!-- 引号图标 -->
            <div class="mb-6 text-white/60 flex justify-center">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14.017 21L14.017 18C14.017 16.8954 14.9124 16 16.017 16H19.017C19.5693 16 20.017 15.5523 20.017 15V9C20.017 8.44772 19.5693 8 19.017 8H15.017C14.4647 8 14.017 8.44772 14.017 9V11C14.017 11.5523 13.5693 12 13.017 12H12.017V5H22.017V15C22.017 18.3137 19.3307 21 16.017 21H14.017ZM5.0166 21L5.0166 18C5.0166 16.8954 5.91203 16 7.0166 16H10.0166C10.5689 16 11.0166 15.5523 11.0166 15V9C11.0166 8.44772 10.5689 8 10.0166 8H6.0166C5.46432 8 5.0166 8.44772 5.0166 9V11C5.0166 11.5523 4.56889 12 4.0166 12H3.0166V5H13.0166V15C13.0166 18.3137 10.3303 21 7.0166 21H5.0166Z" />
                </svg>
            </div>

            <!-- 文字内容 -->
            <h1 id="quote-text" class="text-2xl md:text-4xl lg:text-5xl font-bold leading-relaxed tracking-wide text-white drop-shadow-lg mb-8 min-h-[3rem]">
                正在寻找灵感...
            </h1>

            <!-- 作者 -->
            <div class="w-full flex justify-end">
                <p id="quote-author" class="text-lg md:text-xl text-white/80 font-medium italic border-t border-white/30 pt-4 pl-8 inline-block">
                    ...
                </p>
            </div>
        </div>

        <!-- 按钮区域 -->
        <div class="absolute bottom-10 z-40">
            <button id="refresh-btn" class="group flex items-center gap-2 px-8 py-4 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur-sm border border-white/30 transition-all duration-300 active:scale-95 hover:shadow-lg hover:shadow-white/10 disabled:opacity-50 disabled:cursor-not-allowed">
                <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 transition-transform duration-500">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                <span class="font-medium tracking-widest text-lg">换一句</span>
            </button>
        </div>

        <!-- 全屏Loading遮罩 (仅在图片加载时显示微弱提示) -->
        <div id="loading-indicator" class="absolute inset-0 z-50 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300">
            <div class="w-16 h-16 border-4 border-white/20 border-t-white rounded-full spinner"></div>
        </div>

        <div class="absolute bottom-2 right-4 text-xs text-white/30 z-50 font-sans">
            Images by Unsplash via Picsum
        </div>
    </div>

    <script>
        // === 数据源 ===
        const quotes = [
            { text: "星光不问赶路人，时光不负有心人。", author: "大冰" },
            { text: "生活不仅有眼前的苟且，还有诗和远方。", author: "高晓松" },
            { text: "你若盛开，清风自来。", author: "三毛" },
            { text: "种一棵树最好的时间是十年前，其次是现在。", author: "Dambisa Moyo" },
            { text: "愿你走出半生，归来仍是少年。", author: "孙衍" },
            { text: "世界上只有一种英雄主义，就是在认清生活真相之后依然热爱生活。", author: "罗曼·罗兰" },
            { text: "满地都是六便士，他却抬头看见了月亮。", author: "毛姆" },
            { text: "熬过最苦的日子，做最酷的自己。", author: "佚名" },
            { text: "凡是过去，皆为序章。", author: "莎士比亚" },
            { text: "既然选择了远方，便只顾风雨兼程。", author: "汪国真" },
            { text: "你的负担将变成礼物，你受的苦将照亮你的路。", author: "泰戈尔" },
            { text: "万物皆有裂痕，那是光照进来的地方。", author: "莱昂纳德·科恩" },
            { text: "这短短的一生，我们最终都会失去，你不妨大胆一些，爱一个人，攀一座山，追一个梦。", author: "大鱼海棠" },
            { text: "所谓无底深渊，下去，也是前程万里。", author: "木心" },
            { text: "但行好事，莫问前程。", author: "增广贤文" },
            { text: "每一个不曾起舞的日子，都是对生命的辜负。", author: "尼采" },
            { text: "把脸一直向着阳光，这样就不会见到阴影。", author: "海伦·凯勒" },
            { text: "如果不去遍历世界，我们就不知道什么是我们精神和情感的寄托，但我们一旦遍历了世界，我们就发现我们再也无法回到那美好的地方去了。", author: "村上春树" },
            { text: "要么读书，要么旅行，身体和灵魂，必须有一个在路上。", author: "佚名" },
            { text: "人生没有白走的路，每一步都算数。", author: "李宗盛" }
        ];

        // === DOM 元素 ===
        const dom = {
            bgCurrent: document.getElementById('bg-current'),
            bgNext: document.getElementById('bg-next'),
            card: document.getElementById('quote-card'),
            text: document.getElementById('quote-text'),
            author: document.getElementById('quote-author'),
            btn: document.getElementById('refresh-btn'),
            icon: document.getElementById('refresh-icon'),
            loading: document.getElementById('loading-indicator')
        };

        let isAnimating = false;

        // === 初始化 ===
        window.addEventListener('load', () => {
            refreshContent(true);
        });

        dom.btn.addEventListener('click', () => refreshContent());

        // === 核心逻辑 ===
        function refreshContent(isFirstLoad = false) {
            if (isAnimating && !isFirstLoad) return;
            isAnimating = true;
            setLoadingState(true);

            // 1. 随机获取数据
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            const randomImgUrl = `https://picsum.photos/1920/1080?random=${Date.now()}`;

            // 2. 如果不是第一次加载，先把文字淡出
            if (!isFirstLoad) {
                dom.card.classList.remove('card-enter-active');
                dom.card.classList.add('card-exit-active');
            }

            // 3. 预加载图片
            const img = new Image();
            img.src = randomImgUrl;

            img.onload = () => {
                // 图片加载完毕，执行切换逻辑
                
                // A. 更新文字内容 (延时一点点让退出动画跑一会)
                setTimeout(() => {
                    dom.text.innerText = randomQuote.text;
                    dom.author.innerText = `—— ${randomQuote.author || "佚名"}`;
                    
                    // 文字卡片进场
                    dom.card.classList.remove('card-exit-active', 'card-enter');
                    dom.card.classList.add('card-enter-active');
                }, isFirstLoad ? 0 : 300);

                // B. 背景切换逻辑
                // 将新图片设置在 bg-next 上
                dom.bgNext.style.backgroundImage = `url('${randomImgUrl}')`;
                
                // 淡入 bg-next (它在 bg-current 之上)
                dom.bgNext.classList.remove('opacity-0');
                dom.bgNext.classList.add('opacity-100');

                // 等待背景淡入完成后 (1s)
                setTimeout(() => {
                    // 将 bg-current 替换为新图片 (此时它被 bg-next 盖住，用户看不见变化)
                    dom.bgCurrent.style.backgroundImage = `url('${randomImgUrl}')`;
                    
                    // 重置 bg-next 为透明，为下一次做准备
                    dom.bgNext.classList.remove('opacity-100');
                    dom.bgNext.classList.add('opacity-0');
                    
                    isAnimating = false;
                    setLoadingState(false);
                }, 1000);
            };

            img.onerror = () => {
                console.error("图片加载失败");
                // 即使图片失败，也要更新文字
                dom.text.innerText = randomQuote.text;
                dom.author.innerText = `—— ${randomQuote.author || "佚名"}`;
                dom.card.classList.remove('card-exit-active');
                dom.card.classList.add('card-enter-active');
                
                isAnimating = false;
                setLoadingState(false);
            };
        }

        // === 状态控制 ===
        function setLoadingState(isLoading) {
            if (isLoading) {
                dom.btn.disabled = true;
                dom.icon.classList.add('animate-spin');
                // 只有当加载时间过长时(>200ms)才显示loading圈，避免闪烁
                dom.loadingTimeout = setTimeout(() => {
                     dom.loading.classList.remove('opacity-0');
                }, 200);
            } else {
                dom.btn.disabled = false;
                dom.icon.classList.remove('animate-spin');
                clearTimeout(dom.loadingTimeout);
                dom.loading.classList.add('opacity-0');
            }
        }
    </script>
</body>
</html>
